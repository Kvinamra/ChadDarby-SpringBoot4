<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Registration</title>
    <style>
        .error {color: red;}
    </style>
</head>
<body>
    <h3>Customer Registration Form</h3>
    <i>Fill out the form. Asterisk (*) means required.</i>
    <br><br>
    <form th:object="${customer}" th:action="@{/processCustomerForm}" method="post">
        First Name:
        <label>
            <input type="text" th:field="*{firstName}">
        </label>
        <br><br>
        Last Name (*):
        <label>
            <input type="text" th:field="*{lastName}">
            <span th:if="${#fields.hasErrors('lastName')}"
                  th:errors="*{lastName}" class="error"></span>
        </label>
        <br><br>
        Free Passes:
        <label>
            <input type="text" th:field="*{freePasses}">
            <span th:if="${#fields.hasErrors('freePasses')}"
                  th:errors="*{freePasses}" class="error"></span>
        </label>
        <br><br>
        Postal Code:
        <label>
            <input type="text" th:field="*{postalCode}">
            <span th:if="${#fields.hasErrors('postalCode')}"
                  th:errors="*{postalCode}" class="error"></span>
        </label>
        <br><br>
        Course Code:
        <label>
            <input type="text" th:field="*{courseCode}">
            <span th:if="${#fields.hasErrors('courseCode')}"
                  th:errors="*{courseCode}" class="error"></span>
        </label>
        <br><br>
        <input type="submit" value="Submit" />
    </form>
</body>

</html>
