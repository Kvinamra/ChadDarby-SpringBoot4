<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Confirmation</title>
</head>
<body>
<h3>Student Confirmation Page</h3>
The student is confirmed : <span th:text="${student.firstName} + ' ' + ${student.lastName}"></span>
<br><br>
Country : <span th:text="${student.country}"></span>
<br><br>
Favorite Programming Language : <span th:text="${student.programmingLanguage}"></span>
<br><br>
Favorite Operating System :
<ul>
    <li th:each="system : ${student.operatingSystems}" th:text="${system}"></li>
</ul>
</body>

</html>
