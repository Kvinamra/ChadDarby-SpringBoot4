<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html" lang="">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
</head>
<body>
<h3>Student Registration Form</h3>
<form th:action="@{/processStudentForm}" th:object="${student}" method="post">
    First Name:
    <label>
        <input type="text" th:field="*{firstName}" />
    </label>
    <br><br>
    Last Name:
    <label>
        <input type="text" th:field="*{lastName}" />
    </label>
    <br><br>
    Country:
    <label>
        <select th:field="*{country}">
            <option th:each="tempCountry : ${countries}"
                    th:value="${tempCountry}" th:text="${tempCountry}"> </option>
        </select>
    </label>
    <br><br>
    Favorite Programming Language:
    <label>
        <input type="radio" th:field="*{programmingLanguage}"
               th:each="language : ${languages}"
               th:value="${language}" th:text="${language}">
    </label>
    <br><br>
    Favorite Operating Systems:
    <label>
        <input type="checkbox" th:field="*{operatingSystems}"
               th:each="system : ${systems}"
               th:value="${system}" th:text="${system}">
    </label>
    <br><br>
    <input type="submit" value="Submit" />
</form>
</body>

</html>
